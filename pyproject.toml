[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "steppegrid"
version = "1.0.0"
description = "Renewable microgrid planning for rural Kazakhstan"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "pvlib>=0.13,<0.14"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
visualization = ["matplotlib>=3.9,<4"]
app = ["streamlit>=1.49,<2"]

[project.scripts]
steppegrid-demo = "steppegrid.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["steppegrid"]
