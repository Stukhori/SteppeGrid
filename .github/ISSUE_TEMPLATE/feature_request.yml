name: Feature request
description: Propose a focused improvement to SteppeGrid
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Planning need
      description: What user or research problem should this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and its expected value.
    validations:
      required: true
  - type: textarea
    id: methodology
    attributes:
      label: Methodology and data implications
      description: Note any new assumptions, datasets, provenance, or model changes.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative approaches, if any.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This request does not contain private or sensitive data.
          required: true
